<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Snake Ultra</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .subtitle {
            font-size: 1.2em;
            color: rgba(255, 255, 255, 0.8);
        }

        .refresh-info {
            text-align: center;
            margin-bottom: 20px;
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.6);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .stat-card .icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
            margin: 10px 0;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-card .label {
            font-size: 1.1em;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .section h2 {
            font-size: 1.8em;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
        }

        .room-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .room-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .room-card .room-header {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #FFD700;
        }

        .room-card .room-info {
            margin-bottom: 10px;
            font-size: 0.95em;
        }

        .room-card .room-info span {
            color: rgba(255, 255, 255, 0.7);
        }

        .player-list {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .player-item {
            padding: 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-item .player-name {
            color: #4CAF50;
            font-weight: bold;
        }

        .player-item .player-score {
            color: #FFD700;
        }

        .banned-list {
            display: grid;
            gap: 15px;
        }

        .banned-item {
            background: rgba(255, 68, 68, 0.2);
            border-left: 4px solid #ff4444;
            padding: 15px;
            border-radius: 8px;
        }

        .banned-item .ip {
            font-family: 'Courier New', monospace;
            color: #ff4444;
            font-weight: bold;
            font-size: 1.1em;
        }

        .banned-item .expires {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9em;
            margin-top: 5px;
        }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.2em;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-badge.waiting {
            background: rgba(255, 165, 0, 0.3);
            color: #FFA500;
        }

        .status-badge.playing {
            background: rgba(76, 175, 80, 0.3);
            color: #4CAF50;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading {
            animation: pulse 2s infinite;
        }

        .btn-refresh {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
        }

        .btn-refresh:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.6);
        }

        .actions {
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ Dashboard Admin</h1>
            <p class="subtitle">Snake Ultra - Monitoring en temps réel</p>
        </div>

        <div class="refresh-info">
            ⏱️ Actualisation automatique toutes les 5 secondes
            <br>
            <span id="last-update">Chargement...</span>
        </div>

        <!-- Statistiques globales -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="icon">🏠</div>
                <div class="value" id="total-rooms">-</div>
                <div class="label">Salons Actifs</div>
            </div>

            <div class="stat-card">
                <div class="icon">👥</div>
                <div class="value" id="total-players">-</div>
                <div class="label">Joueurs en Ligne</div>
            </div>

            <div class="stat-card">
                <div class="icon">⚠️</div>
                <div class="value" id="total-violations">-</div>
                <div class="label">Violations Détectées</div>
            </div>

            <div class="stat-card">
                <div class="icon">🚫</div>
                <div class="value" id="total-banned">-</div>
                <div class="label">IPs Bannies</div>
            </div>
        </div>

        <!-- Salons actifs -->
        <div class="section">
            <h2>🏠 Salons Actifs</h2>
            <div class="room-grid" id="rooms-container">
                <div class="empty-message loading">Chargement des salons...</div>
            </div>
        </div>

        <!-- IPs bannies -->
        <div class="section">
            <h2>🚫 IPs Bannies</h2>
            <div class="banned-list" id="banned-container">
                <div class="empty-message loading">Chargement des bannissements...</div>
            </div>
        </div>

        <!-- Actions -->
        <div class="actions">
            <button class="btn-refresh" onclick="fetchSecurityData()">🔄 Actualiser Maintenant</button>
        </div>
    </div>

    <script>
        let refreshInterval;

        // Fetch security data from backend
        async function fetchSecurityData() {
            try {
                const response = await fetch('http://localhost:3000/security');
                const data = await response.json();

                // Update stats
                document.getElementById('total-rooms').textContent = data.totalRooms || 0;
                document.getElementById('total-players').textContent = data.totalPlayers || 0;
                document.getElementById('total-violations').textContent = data.totalViolations || 0;
                document.getElementById('total-banned').textContent = data.bannedIPs?.length || 0;

                // Update last update time
                const now = new Date();
                document.getElementById('last-update').textContent =
                    `Dernière mise à jour: ${now.toLocaleTimeString('fr-FR')}`;

                // Display rooms
                displayRooms(data.rooms);

                // Display banned IPs
                displayBannedIPs(data.bannedIPs);

            } catch (error) {
                console.error('Erreur lors de la récupération des données:', error);
                document.getElementById('last-update').textContent =
                    '❌ Erreur de connexion au serveur';
            }
        }

        // Display rooms
        function displayRooms(rooms) {
            const container = document.getElementById('rooms-container');

            if (!rooms || rooms.length === 0) {
                container.innerHTML = '<div class="empty-message">✅ Aucun salon actif</div>';
                return;
            }

            container.innerHTML = rooms.map(room => {
                const status = room.gameStarted ?
                    '<span class="status-badge playing">En cours</span>' :
                    '<span class="status-badge waiting">En attente</span>';

                const playersHTML = room.players.map(player => `
                    <div class="player-item">
                        <span class="player-name">${player.pseudo || player.id}</span>
                        <span class="player-score">Score: ${player.score || 0}</span>
                    </div>
                `).join('');

                return `
                    <div class="room-card">
                        <div class="room-header">
                            🏠 ${room.id}
                        </div>
                        <div class="room-info">
                            ${status}
                        </div>
                        <div class="room-info">
                            <span>👥 Joueurs:</span> ${room.players.length}/${room.maxPlayers || 2}
                        </div>
                        <div class="player-list">
                            ${playersHTML || '<div class="empty-message">Aucun joueur</div>'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Display banned IPs
        function displayBannedIPs(bannedIPs) {
            const container = document.getElementById('banned-container');

            if (!bannedIPs || bannedIPs.length === 0) {
                container.innerHTML = '<div class="empty-message">✅ Aucune IP bannie actuellement</div>';
                return;
            }

            container.innerHTML = bannedIPs.map(ban => {
                const expiresDate = new Date(ban.expiresAt);
                const now = new Date();
                const remainingMs = expiresDate - now;
                const remainingMin = Math.ceil(remainingMs / 60000);

                return `
                    <div class="banned-item">
                        <div class="ip">🚫 ${ban.ip}</div>
                        <div class="expires">
                            Expire dans: ${remainingMin > 0 ? remainingMin + ' minutes' : 'Expiré'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Start auto-refresh
        function startAutoRefresh() {
            // Fetch immediately
            fetchSecurityData();

            // Then every 5 seconds
            refreshInterval = setInterval(fetchSecurityData, 5000);
        }

        // Stop auto-refresh
        function stopAutoRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        }

        // Initialize on page load
        window.addEventListener('load', startAutoRefresh);

        // Clean up on page unload
        window.addEventListener('beforeunload', stopAutoRefresh);
    </script>
</body>
</html>
